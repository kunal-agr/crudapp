<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Error Occurred</title>
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
        <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    </head>

    <body class="container my-5">
    <div id="root"></div>

    <script type="text/babel">
        const ErrorPage = () => {
            const params = new URLSearchParams(window.location.search);
            const status = params.get("status") || 500;
            const message = params.get("message") || "Unexpected error occurred";
            const path = params.get("path") || "N/A";

            return (
                <div>
                    <h2 className="text-danger">Something went wrong!</h2>
                    <p className="text-muted">We encountered an issue processing your request.</p>

                    <div className="card mt-4">
                        <div className="card-header bg-dark text-white">
                            Error Information
                        </div>
                        <div className="card-body bg-light">
                            <p><strong>Status:</strong></p>
                            <pre>{status}</pre>

                            <p><strong>Message:</strong></p>
                            <pre>{message}</pre>

                            <p><strong>Path:</strong></p>
                            <pre>{path}</pre>
                        </div>
                    </div>

                    <a href="student-list.html" className="btn btn-primary mt-3">Back to Home</a>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<ErrorPage />);
    </script>
    </body>
</html>
