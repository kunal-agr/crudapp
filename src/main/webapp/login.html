<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | CRUD App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            border: none;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.95);
            transition: transform 0.3s ease;
        }
        .login-card:hover {
            transform: translateY(-5px);
        }
        .btn-primary {
            background: #667eea;
            border: none;
            padding: 10px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #5a6fd6;
        }
        .input-group-text {
            background: transparent;
            border-right: none;
        }
        .form-control {
            border-left: none;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #dee2e6;
        }
    </style>
</head>

    <body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg login-card p-4" style="width: 380px;">
        <div class="text-center mb-4">
            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                <i class="fa-solid fa-lock fa-xl"></i>
            </div>
            <h3 class="fw-bold text-dark">Welcome Back</h3>
            <p class="text-muted small">Please enter your details to login</p>
        </div>

        <div id="success" class="alert alert-success d-none py-2 small"></div>
        <div id="error" class="alert alert-danger d-none py-2 small"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label small fw-bold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="Enter username" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-key text-muted"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button class="btn btn-primary w-100 mb-3 shadow-sm" type="submit">
                Login <i class="fa-solid fa-arrow-right ms-2"></i>
            </button>
        </form>

        <div class="text-center">
            <p class="mb-0 small text-muted">Don’t have an account?
                <a href="register.html" class="text-decoration-none fw-bold text-primary">Create one</a>
            </p>
        </div>
    </div>

    <script>
        const form = document.getElementById("loginForm");
        const errorBox = document.getElementById("error");
        const successBox = document.getElementById("success");
        const contextPath = "/" + window.location.pathname.split("/")[1];

        const params = new URLSearchParams(window.location.search);
        if (params.get("success")) {
            successBox.innerText = params.get("success");
            successBox.classList.remove("d-none");
        }

        form.addEventListener("submit", e => {
            e.preventDefault();
            errorBox.classList.add("d-none");

            fetch(`${contextPath}/api/auth/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value
                })
            })
            .then(res => {
                if (!res.ok) return res.json().then(j => { throw j; });
                return res.json();
            })
            .then(() => { window.location.href = "student-list.html"; })
            .catch(err => {
                errorBox.innerText = err.error || "Login failed";
                errorBox.classList.remove("d-none");
            });
        });
    </script>

    </body>
</html>
