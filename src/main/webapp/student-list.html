<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>MVC CRUD APPLICATION</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    </head>

    <body class="container mt-4">

    <h2 class="text-center mb-2">MVC CRUD APPLICATION</h2>
    <h5 class="text-center mb-4">SERVLET + REST API</h5>

    <a href="student-form.html" class="btn btn-outline-primary mb-3">
        <i class="fa-solid fa-user-plus me-2"></i> Add Student
    </a>

    <table class="table table-bordered table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>Mobile</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="tableBody">
        <tr>
            <td colspan="5" class="text-center">Loading...</td>
        </tr>
        </tbody>
    </table>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="text-muted">
            Showing <strong id="range"></strong> of <strong id="totalRecords"></strong>
        </div>

        <div class="d-flex align-items-center">
            <span class="me-2">Show</span>
            <select id="pageSize" class="form-select form-select-sm w-auto">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="50">50</option>
            </select>
            <span class="ms-2">entries</span>
        </div>
    </div>

    <nav>
        <ul class="pagination justify-content-center" id="pagination"></ul>
    </nav>

    <script>
        let page = 1;
        let size = 5;

        const contextPath = window.location.pathname.split('/')[1];
        const api = `/${contextPath}/api/students`;

        function redirectError(res, path) {
            window.location.href =
                `error.html?status=${res.status}&message=${encodeURIComponent(res.statusText)}&path=${path}`;
        }

        function loadStudents() {
            fetch(`${api}?page=${page}&size=${size}`)
                .then(res => {
                    if (!res.ok) {
                        redirectError(res, api);
                        throw new Error();
                    }
                    return res.json();
                })
                .then(json => {
                    const tbody = document.getElementById("tableBody");
                    tbody.innerHTML = "";

                    if (!json.data || json.data.length === 0) {
                        tbody.innerHTML =
                            `<tr><td colspan="5" class="text-center">No Students Found</td></tr>`;
                        document.getElementById("range").innerText = '0 → 0';
                        document.getElementById("totalRecords").innerText = '0';
                        renderPagination(0);
                        return;
                    }

                    json.data.forEach((s, i) => {
                        tbody.innerHTML += `
                            <tr>
                                <td class="text-center">${(page - 1) * size + i + 1}</td>
                                <td class="text-center">${s.name}</td>
                                <td class="text-center">${s.email}</td>
                                <td class="text-center">${s.mobile}</td>
                                <td class="text-center">
                                    <a href="student-form.html?id=${s.id}" class="btn btn-info btn-sm">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </a>
                                    <button class="btn btn-danger btn-sm ms-1"
                                        onclick="deleteStudent(${s.id})">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });

                    const start = (page - 1) * size + 1;
                    const end = Math.min(start + size - 1, json.total);

                    document.getElementById("range").innerText = `${start} → ${end}`;
                    document.getElementById("totalRecords").innerText = json.total;

                    renderPagination(json.total);
                })
                .catch(() => {
                    window.location.href =
                        `error.html?status=500&message=Cannot connect to server&path=${api}`;
                });
        }

        function renderPagination(total) {
            const totalPages = Math.ceil(total / size);
            const ul = document.getElementById("pagination");
            ul.innerHTML = "";

            const add = (label, p, disabled, active) => {
                ul.innerHTML += `
                    <li class="page-item ${disabled ? "disabled" : ""} ${active ? "active" : ""}">
                        <a class="page-link" href="#" onclick="go(${p})">${label}</a>
                    </li>`;
            };

            add("First", 1, page === 1);
            add("«", page - 1, page === 1);

            for (let i = 1; i <= totalPages; i++) add(i, i, false, i === page);

            add("»", page + 1, page === totalPages);
            add("Last", totalPages, page === totalPages);
        }

        function go(p) {
            if (p < 1) return;
            page = p;
            loadStudents();
        }

        function deleteStudent(id) {
            if (!confirm("Are you sure?")) return;

            fetch(`${api}/${id}`, { method: "DELETE" })
                .then(res => {
                    if (!res.ok) {
                        redirectError(res, `${api}/${id}`);
                        throw new Error();
                    }
                    loadStudents();
                })
                .catch(() => {
                    window.location.href =
                        `error.html?status=500&message=Delete failed&path=${api}/${id}`;
                });
        }

        loadStudents();
    </script>

    </body>
</html>
