<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | CRUD App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .register-card {
            border: none;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.95);
        }
        .btn-success {
            background: #11998e;
            border: none;
            padding: 10px;
            font-weight: 600;
        }
        .btn-success:hover {
            background: #0e867d;
        }
        .input-group-text { background: transparent; border-right: none; }
        .form-control { border-left: none; }
        .form-control:focus { box-shadow: none; border-color: #dee2e6; }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

<div class="card shadow-lg register-card p-4" style="width: 420px;">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-dark">Join Us</h3>
        <p class="text-muted small">Fill in the details to create your account</p>
    </div>

    <div id="error" class="alert alert-danger d-none py-2 small"></div>

    <form id="registerForm">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label small fw-bold">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-id-card text-muted"></i></span>
                    <input type="text" id="name" class="form-control" placeholder="Name" required>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label small fw-bold">Mobile</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-phone text-muted"></i></span>
                    <input type="text" id="mobile" class="form-control" placeholder="Phone" required>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-bold">Username</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-user text-muted"></i></span>
                <input type="text" id="username" class="form-control" placeholder="Pick a username" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-bold">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-key text-muted"></i></span>
                <input type="password" id="password" class="form-control" placeholder="Create password" required>
            </div>
        </div>

        <button class="btn btn-success w-100 mb-3 shadow-sm" type="submit">
            Create Account <i class="fa-solid fa-user-plus ms-2"></i>
        </button>
    </form>

    <div class="text-center">
        <p class="mb-0 small text-muted">Already have an account?
            <a href="login.html" class="text-decoration-none fw-bold text-success">Sign In</a>
        </p>
    </div>
</div>

<script>
    const form = document.getElementById("registerForm");
    const errorBox = document.getElementById("error");
    const contextPath = "/" + window.location.pathname.split("/")[1];

    form.addEventListener("submit", e => {
        e.preventDefault();
        errorBox.classList.add("d-none");

        fetch(`${contextPath}/api/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name: document.getElementById("name").value,
                mobile: document.getElementById("mobile").value,
                username: document.getElementById("username").value,
                password: document.getElementById("password").value
            })
        })
        .then(res => {
            if (!res.ok) return res.json().then(j => { throw j; });
            return res.json();
        })
        .then(() => {
            window.location.href = "login.html?success=Registration successful. Please login.";
        })
        .catch(err => {
            errorBox.innerText = err.error || "Registration failed";
            errorBox.classList.remove("d-none");
        });
    });
</script>

</body>
</html>
