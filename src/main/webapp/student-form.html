<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>MVC CRUD FORM</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
        <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    </head>

    <body class="container mt-4">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function StudentForm() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            const contextPath = window.location.pathname.split('/')[1];
            const api = `/${contextPath}/api/students`;

            const [student, setStudent] = useState({ name:'', email:'', mobile:'' });
            const [errors, setErrors] = useState({});
            const [title, setTitle] = useState(id ? "Edit Student" : "Add Student");

            const redirectError = (status, message, path) => {
                window.location.href =
                    `error.html?status=${status}&message=${encodeURIComponent(message)}&path=${path}`;
            };

            useEffect(() => {
                if (id) {
                    fetch(`${api}/${id}`)
                        .then(res => {
                            if (!res.ok) {
                                redirectError(res.status, res.statusText, `${api}/${id}`);
                                throw new Error();
                            }
                            return res.json();
                        })
                        .then(data => setStudent(data))
                        .catch(() => {});
                }
            }, []);

            const handleChange = e =>
                setStudent({ ...student, [e.target.id]: e.target.value });

            const validate = () => {
                let e = {};
                if (student.name.length < 3) e.name = "Min 3 chars";
                if (!student.email.includes("@")) e.email = "Invalid email";
                if (!/^\d{10}$/.test(student.mobile)) e.mobile = "10 digits only";
                setErrors(e);
                return Object.keys(e).length === 0;
            };

            const save = () => {
                if (!validate()) return;

                fetch(id ? `${api}/${id}` : api, {
                    method: id ? "PUT" : "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(student)
                })
                .then(res => {
                    if (!res.ok) {
                        redirectError(res.status, res.statusText, api);
                        throw new Error();
                    }
                    window.location.href = "student-list.html";
                })
                .catch(() => {});
            };

            return (
                <div>
                    <h2 className="text-center mb-3">MVC CRUD APPLICATION</h2>
                    <h4 className="text-danger mb-4">{title}</h4>

                    <input className="form-control mb-2" id="name"
                        placeholder="Name" value={student.name} onChange={handleChange}/>
                    <p className="text-danger">{errors.name}</p>

                    <input className="form-control mb-2" id="email"
                        placeholder="Email" value={student.email} onChange={handleChange}/>
                    <p className="text-danger">{errors.email}</p>

                    <input className="form-control mb-2" id="mobile"
                        placeholder="Mobile" value={student.mobile} onChange={handleChange}/>
                    <p className="text-danger">{errors.mobile}</p>

                    <button className="btn btn-success" onClick={save}>Save</button>
                    <a href="student-list.html" className="btn btn-secondary ms-2">Cancel</a>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<StudentForm />);
    </script>

    </body>
</html>
